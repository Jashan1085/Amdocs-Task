<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head><body><header th:replace="~{fragments/layout :: nav}"></header>
<main class="container main-content"><p class="eyebrow" th:text="${title}"></p><h1>Welcome, <span th:text="${displayName}"></span>.</h1>
<p class="lead text-secondary">Your service assurance workspace.</p><section class="card workspace-card mt-4"><div class="card-body p-4 p-md-5">
<span class="workspace-symbol" aria-hidden="true">&#9673;</span><h2 class="h4 mt-3" th:text="${subtitle}"></h2><p class="text-secondary mb-0" th:text="${description}"></p>
<div class="d-flex flex-wrap gap-2 mt-4" th:if="${workflowBase == '/customer' or workflowBase == '/service-desk'}"><a class="btn btn-primary" th:href="@{${workflowBase + '/services'}}">Services / raise a ticket</a><a class="btn btn-outline-primary" th:href="@{${workflowBase + '/tickets'}}">View tickets</a></div>
<p class="mt-3 mb-0" th:if="${workflowBase == '/service-desk'}"><a class="btn btn-outline-primary" th:href="@{/service-desk/queue}">Assignment queue</a></p><p class="mt-3 mb-0" th:if="${engineerWorkspace == true}"><a class="btn btn-primary" th:href="@{/engineer/tickets}">View assigned tickets</a></p><p class="mt-3 mb-0" th:if="${workflowBase == '/service-desk' or managerSla == true}"><a class="btn btn-outline-primary" th:href="@{${managerSla == true ? '/manager/sla' : '/service-desk/sla'}}">SLA monitoring</a></p><p class="mt-3"><a class="btn btn-outline-primary" th:href="@{${workflowBase+'/notifications'}}" th:text="${workflowBase == '/service-desk' ? 'Notification processing' : 'Notification inbox'}"></a></p><p th:if="${workflowBase == '/service-desk'}"><a class="btn btn-outline-primary" th:href="@{/service-desk/network/events}">Network events and simulator</a></p></div></section><section th:replace="~{fragments/dashboard-stats :: stats}"></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
