<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Node service mappings')}"></head><body><header th:replace="~{fragments/layout :: nav}"></header>
<main class="container main-content"><h1>Node service mappings</h1><p>Node ID: <strong th:text="${nodeId}"></strong>. <a th:href="@{/service-desk/network/nodes}">All nodes</a></p>
<form method="post" th:action="@{/service-desk/network/nodes/{id}/services(id=${nodeId})}" class="card p-4 mb-4"><label class="form-label" for="serviceCode">Existing service code</label><input id="serviceCode" name="serviceCode" class="form-control mb-3" maxlength="100" placeholder="SVC-MOB-001" required><p class="form-text">Use the exact service code from customer service listings. Only active customers and services generate event tickets.</p><button class="btn btn-primary" type="submit">Link service</button></form>
<p th:if="${results.items.empty}">No mapped services. Events will remain available for desk review.</p><table class="table bg-white"><thead><tr><th>Service code</th><th>Name</th><th>Status</th></tr></thead><tbody><tr th:each="item : ${results.items}"><td th:text="${item.service_code}"></td><td th:text="${item.service_name}"></td><td th:text="${item.service_status}"></td></tr></tbody></table>
<nav class="d-flex gap-3" aria-label="Mapping pages"><a th:if="${results.previous}" th:href="@{/service-desk/network/nodes/{id}(id=${nodeId},page=${results.number-1})}">Previous</a><span th:text="${'Page '+(results.number+1)}"></span><a th:if="${results.next}" th:href="@{/service-desk/network/nodes/{id}(id=${nodeId},page=${results.number+1})}">Next</a></nav>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
