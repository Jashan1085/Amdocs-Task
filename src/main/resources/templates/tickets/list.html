<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Trouble tickets')}"></head><body><header th:replace="~{fragments/layout :: nav}"></header>
<main class="container main-content"><p class="eyebrow">TICKET TRACKING</p><h1 th:text="${queue == true ? 'Assignment queue' : (desk ? 'Customer tickets' : 'Your tickets')}"></h1><div class="d-flex gap-3 mb-4"><a th:href="@{${base + '/dashboard'}}">Workspace</a><a th:unless="${engineer == true}" th:href="@{${base + '/services'}}">Raise a ticket</a></div>
<form th:action="@{${listPath}}" method="get" class="row g-3 align-items-end mb-4"><div class="col-md-4"><label for="status" class="form-label">Status</label><select id="status" name="status" class="form-select"><option value="">All statuses</option><option th:each="value : ${statuses}" th:value="${value}" th:text="${value}" th:selected="${value == selectedStatus}"></option></select></div><div class="col-md-4"><label for="priority" class="form-label">Priority</label><select id="priority" name="priority" class="form-select"><option value="">All priorities</option><option th:each="value : ${priorities}" th:value="${value}" th:text="${value}" th:selected="${value == selectedPriority}"></option></select></div><div class="col-md-4"><button class="btn btn-primary" type="submit">Filter tickets</button></div></form>
<p th:if="${results.items.empty}">No tickets match these filters on this page.</p><div class="table-responsive" th:unless="${results.items.empty}"><table class="table table-hover bg-white"><thead><tr><th>Ticket</th><th>Status</th><th>Priority</th><th>Category</th><th>Created</th></tr></thead><tbody><tr th:each="ticket : ${results.items}"><td><a th:href="@{${base + '/tickets/' + ticket.ticketId}}" th:text="${ticket.ticketNumber}"></a></td><td th:text="${ticket.status}"></td><td th:text="${ticket.priority}"></td><td th:text="${ticket.category}"></td><td th:text="${@ticketTimes.format(ticket.createdAt)}"></td></tr></tbody></table></div>
<nav aria-label="Ticket pages" class="d-flex gap-3"><a th:if="${results.previous}" th:href="@{${listPath}(status=${selectedStatus},priority=${selectedPriority},page=${results.number-1})}">Previous</a><span th:text="${'Page '+(results.number+1)}"></span><a th:if="${results.next}" th:href="@{${listPath}(status=${selectedStatus},priority=${selectedPriority},page=${results.number+1})}">Next</a></nav></main>
<footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
