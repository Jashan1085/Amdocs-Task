<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ticket details')}"></head><body><header th:replace="~{fragments/layout :: nav}"></header>
<main class="container main-content"><p class="eyebrow">TICKET DETAILS</p><h1 th:text="${ticket.ticketNumber}"></h1><a th:href="@{${base + '/tickets'}}">Back to tickets</a><p class="alert alert-success mt-3" role="status" th:if="${notice}" th:text="${notice}"></p>
<section class="card p-4 my-4"><h2 class="h4" th:text="${service.serviceCode+' Â· '+service.serviceName}"></h2><dl class="row"><dt class="col-sm-3">Status</dt><dd class="col-sm-9" th:text="${ticket.status}"></dd><dt class="col-sm-3">Assigned engineer</dt><dd class="col-sm-9" th:text="${assignedEngineer == null ? 'Unassigned' : assignedEngineer.employeeCode+' · '+assignedEngineer.engineerName}"></dd><dt class="col-sm-3">Priority / severity</dt><dd class="col-sm-9" th:text="${ticket.priority+' / '+ticket.severity}"></dd><dt class="col-sm-3">Category</dt><dd class="col-sm-9" th:text="${ticket.category}"></dd><dt class="col-sm-3">Created</dt><dd class="col-sm-9" th:text="${@ticketTimes.format(ticket.createdAt)}"></dd><dt class="col-sm-3">Response deadline</dt><dd class="col-sm-9" th:text="${@ticketTimes.format(ticket.responseDeadline)}"></dd><dt class="col-sm-3">Resolution deadline</dt><dd class="col-sm-9" th:text="${@ticketTimes.format(ticket.resolutionDeadline)}"></dd><dt class="col-sm-3">SLA policy version</dt><dd class="col-sm-9" th:text="${ticket.slaPolicyVersion}"></dd><dt class="col-sm-3">First response</dt><dd class="col-sm-9" th:text="${@ticketTimes.format(ticket.firstResponseAt)}"></dd><dt class="col-sm-3">Closed</dt><dd class="col-sm-9" th:text="${@ticketTimes.format(ticket.closedAt)}"></dd><dt class="col-sm-3">Resolved</dt><dd class="col-sm-9" th:text="${@ticketTimes.format(ticket.resolvedAt)}"></dd></dl><h3 class="h5">Issue description</h3><p style="white-space:pre-wrap;overflow-wrap:anywhere" th:text="${ticket.description}"></p></section>
<p th:if="${desk and assignable}"><a class="btn btn-primary" th:href="@{/service-desk/tickets/{id}/assignment(id=${ticket.ticketId})}" th:text="${ticket.assignedEngineerId == null ? 'Assign engineer' : 'Reassign engineer'}"></a></p><section th:replace="~{tickets/sla-details :: details}"></section><section th:replace="~{tickets/lifecycle :: details}"></section><h2 class="h4">Status history</h2><div class="table-responsive"><table class="table bg-white"><thead><tr><th>Time</th><th>From</th><th>To</th><th>Actor</th><th>Remarks</th></tr></thead><tbody><tr th:each="entry : ${results.items}"><td th:text="${@ticketTimes.format(entry.changedAt)}"></td><td th:text="${entry.oldStatus == null ? 'Created' : entry.oldStatus}"></td><td th:text="${entry.newStatus}"></td><td th:text="${entry.changedBy}"></td><td th:text="${entry.remarks}"></td></tr></tbody></table></div><nav aria-label="History pages" class="d-flex gap-3"><a th:if="${results.previous}" th:href="@{${base + '/tickets/' + ticket.ticketId}(page=${results.number-1})}">Previous</a><span th:text="${'Page '+(results.number+1)}"></span><a th:if="${results.next}" th:href="@{${base + '/tickets/' + ticket.ticketId}(page=${results.number+1})}">Next</a></nav></main>
<footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
