<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Services')}"></head><body><header th:replace="~{fragments/layout :: nav}"></header>
<main class="container main-content"><p class="eyebrow">SERVICES AND SUPPORT</p><h1 th:text="${desk ? 'Find customer services' : 'Your services'}"></h1>
<div class="d-flex gap-3 mb-4"><a th:href="@{${base + '/dashboard'}}">Workspace</a><a th:href="@{${base + '/tickets'}}">View tickets</a></div>
<form th:if="${desk}" th:action="@{${base + '/services'}}" method="get" class="card p-4 mb-4"><label for="customerNumber" class="form-label">Customer number</label><div class="d-flex gap-2"><input id="customerNumber" name="customerNumber" th:value="${customerNumber}" maxlength="30" class="form-control" placeholder="e.g. CUST1001" required><button class="btn btn-primary" type="submit">Find services</button></div></form>
<section th:if="${results != null}"><h2 class="h4" th:text="${customer.customerNumber+' · '+customer.customerName}"></h2>
<p th:if="${results.items.empty}">No services on this page.</p><div class="table-responsive" th:unless="${results.items.empty}"><table class="table table-hover bg-white align-middle"><thead><tr><th>Service</th><th>Type</th><th>Region</th><th>Status</th><th>Support</th></tr></thead><tbody><tr th:each="service : ${results.items}"><td><strong th:text="${service.serviceCode}"></strong><br><span th:text="${service.serviceName}"></span></td><td th:text="${service.serviceType}"></td><td th:text="${service.region}"></td><td th:text="${service.serviceStatus}"></td><td><a th:if="${service.serviceStatus.name() == 'ACTIVE' and customer.status.name() == 'ACTIVE'}" class="btn btn-sm btn-primary" th:href="@{${base + '/tickets/new'}(serviceId=${service.serviceId})}">Raise ticket</a><span th:unless="${service.serviceStatus.name() == 'ACTIVE' and customer.status.name() == 'ACTIVE'}">Contact service desk</span></td></tr></tbody></table></div>
<nav aria-label="Service pages" class="d-flex gap-3"><a th:if="${results.previous}" th:href="@{${base + '/services'}(customerNumber=${customerNumber},page=${results.number-1})}">Previous</a><span th:text="${'Page '+(results.number+1)}"></span><a th:if="${results.next}" th:href="@{${base + '/services'}(customerNumber=${customerNumber},page=${results.number+1})}">Next</a></nav></section></main>
<footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
