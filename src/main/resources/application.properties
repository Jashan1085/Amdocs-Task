spring.application.name=TelecomOSS
spring.config.import=optional:file:./config/application-local.properties

# Override with SPRING_DATASOURCE_URL / USERNAME / PASSWORD or the ignored local file.
spring.datasource.url=jdbc:postgresql://localhost:5432/telecom_oss_dev
spring.datasource.username=telecom_app
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1

# Schema changes are applied explicitly using the SQL migrations.
spring.sql.init.mode=never

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
spring.mvc.ignore-default-model-on-redirect=true

# The web application checks SLA every 60 seconds, starting 60 seconds after ready.
telecom.sla.monitor.enabled=true

# Web-only notification dispatch and persisted network event recovery.
telecom.jobs.enabled=true
